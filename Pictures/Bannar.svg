<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff8c1a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff8c1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#0a0a0c"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#f4f1ec" opacity="0.35">
    <circle cx="110" cy="70" r="1.6"/>
    <circle cx="230" cy="120" r="1.2"/>
    <circle cx="360" cy="60" r="1.6"/>
    <circle cx="520" cy="100" r="1.2"/>
    <circle cx="760" cy="55" r="1.6"/>
    <circle cx="900" cy="120" r="1.2"/>
    <circle cx="1080" cy="70" r="1.6"/>
    <circle cx="1190" cy="150" r="1.2"/>
  </g>

  <!-- horizon grid -->
  <g stroke="#ff8c1a" stroke-width="1" opacity="0.14">
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="450" x2="1280" y2="450"/>
    <line x1="0" y1="500" x2="1280" y2="500"/>
    <line x1="640" y1="370" x2="120" y2="640"/>
    <line x1="640" y1="370" x2="380" y2="640"/>
    <line x1="640" y1="370" x2="640" y2="640"/>
    <line x1="640" y1="370" x2="900" y2="640"/>
    <line x1="640" y1="370" x2="1160" y2="640"/>
  </g>

  <!-- mountain ridges, three depths of the same accent color -->
  <polygon points="0,460 160,370 340,440 520,330 700,430 880,350 1060,430 1280,380 1280,640 0,640" fill="#3a2410" opacity="0.6"/>
  <polygon points="0,520 200,430 420,500 640,390 860,490 1080,420 1280,470 1280,640 0,640" fill="#5a3512" opacity="0.8"/>
  <polygon points="0,580 240,500 480,570 720,460 960,560 1200,490 1280,540 1280,640 0,640" fill="#7a4514"/>

  <!-- window chrome frame around the wordmark, matching the site's terminal look -->
  <rect x="140" y="190" width="1000" height="220" rx="20" fill="#16141899" stroke="#ffffff2e" stroke-width="1.5"/>
  <rect x="140" y="190" width="1000" height="42" rx="20" fill="#ffffff0a"/>
  <line x1="140" y1="232" x2="1140" y2="232" stroke="#ffffff1f" stroke-width="1"/>
  <circle cx="168" cy="211" r="6" fill="#ffffff26"/>
  <circle cx="188" cy="211" r="6" fill="#ffffff26"/>
  <circle cx="208" cy="211" r="6" fill="#ffffff26"/>
  <text x="640" y="216" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#a9a29a">Administrator: Hi+OPTIMIZER</text>

  <!-- four-square logo -->
  <g transform="translate(196,270)" fill="#f4f1ec">
    <rect x="0" y="0" width="34" height="34" rx="4"/>
    <rect x="42" y="0" width="34" height="34" rx="4"/>
    <rect x="0" y="42" width="34" height="34" rx="4"/>
    <rect x="42" y="42" width="34" height="34" rx="4"/>
  </g>

  <text x="300" y="320" font-family="'Press Start 2P', 'IBM Plex Mono', monospace" font-size="42" fill="#ff8c1a">Hi<tspan fill="#ffcf5c">+</tspan>OPTIMIZER</text>
  <text x="300" y="365" font-family="'IBM Plex Mono', monospace" font-size="19" fill="#e6e0d8">Windows tuned like a terminal — clean up, repair, and speed it up.</text>

  <g font-family="'IBM Plex Mono', monospace" font-size="14" fill="#a9a29a">
    <text x="300" y="398">16 modules · CPU · GPU · Mouse · Keyboard · Latency · System Tweaks</text>
  </g>
</svg>
